[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaver-protocol"
version = "0.1.0"
description = "Attested multi-observer verification for AI systems."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["ai", "verification", "compliance", "audit", "llm", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.25"]
openai = ["openai>=1.30"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/claudenunc/weaver-protocol"
Issues = "https://github.com/claudenunc/weaver-protocol/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["weaver*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.11"
strict = true
